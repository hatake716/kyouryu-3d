name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify catalog is reproducible
        run: |
          python3 tools/build_catalog.py
          python3 tools/catalog/write_profiles.py
          python3 tools/check_catalog.py
          git diff --exit-code -- app/src/main/assets/dinosaurs.json app/src/main/java/io/github/hatake716/dinobones/model/ModelProfiles.kt
      - name: Validate Google Play listing assets
        run: python3 tools/check_store_assets.py
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds-unsigned-release
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/
