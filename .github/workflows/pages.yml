name: Publish support pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/site.css'
      - 'docs/privacy/**'
      - 'docs/parents/**'
      - 'docs/credits/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Collect public support pages
        run: |
          mkdir -p _site
          cp docs/index.html docs/site.css _site/
          cp -R docs/privacy docs/parents docs/credits _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
