<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500" role="img" aria-labelledby="title desc">
<title id="title">恐竜の骨格３D</title><desc id="desc">100の骨格が待つ、太古の展示室へ。土色の展示空間と独自の頭骨シンボル。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#251b15"/><stop offset="1" stop-color="#5b402b"/></linearGradient><linearGradient id="light" x2="0" y2="1"><stop stop-color="#f4dfb7" stop-opacity=".12"/><stop offset="1" stop-color="#f4dfb7" stop-opacity="0"/></linearGradient><linearGradient id="bone" x2="1" y2="1"><stop stop-color="#fff1ce"/><stop offset="1" stop-color="#c5a376"/></linearGradient></defs>
<rect width="1024" height="500" fill="url(#bg)"/>
<path d="M650 0H918L1024 400H520Z" fill="url(#light)"/>
<g fill="none" stroke="#d5b88c" stroke-opacity=".16"><path d="M0 45H1024M0 455H1024M600 45L520 455M960 45L1024 455M0 390H1024"/><path d="M20 0L210 45M295 0L425 45M570 0L640 45M845 0L855 45"/></g>
<g font-family="Noto Sans CJK JP, sans-serif"><text x="64" y="107" font-size="12" letter-spacing="3" fill="#d4b68c">VIRTUAL PALEO MUSEUM</text><text x="60" y="180" font-size="49" font-weight="700" fill="#fff1d2">恐竜の骨格３D</text><path d="M64 208H120" stroke="#be8b50" stroke-width="3"/><text x="63" y="268" font-size="25" fill="#efd9b4">100の骨格が待つ、</text><text x="63" y="308" font-size="30" font-weight="600" fill="#efd9b4">太古の展示室へ。</text><text x="64" y="390" font-size="16" letter-spacing="2" fill="#cab392">歩く。見上げる。骨格から知る。</text></g>
